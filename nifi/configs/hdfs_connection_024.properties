# ==============================================================================
# UrbanPulse (_024) — Apache NiFi to Hadoop HDFS Connection Reference
# ==============================================================================
# Catatan Keselamatan:
# - File ini adalah dokumentasi parameter koneksi NiFi -> HDFS di workspace proyek.
# - Konfigurasi asli Hadoop di WSL (/usr/local/hadoop/etc/hadoop/) TIDAK diubah.
# - PutHDFS membaca langsung file konfigurasi Hadoop berikut secara read-only.
# ==============================================================================

urbanpulse.project_id_024=urbanpulse_024
urbanpulse.flow_name_024=urbanpulse_ingestion_024

# Referensi file konfigurasi Hadoop 3.5.0 di WSL2 Ubuntu 24.04.4 (read-only)
hadoop.configuration.resources_024=/usr/local/hadoop/etc/hadoop/core-site.xml,/usr/local/hadoop/etc/hadoop/hdfs-site.xml
hadoop.fs.defaultFS_024=hdfs://localhost:9000
hadoop.dfs.replication_024=1
hadoop.namenode.web_ui_024=http://localhost:9870

# Sumber lokal (mount WSL untuk workspace Windows, read-only / tidak dihapus)
nifi.source.directory_024=/mnt/d/A University/Big Data dan Analitik/Project Akhir/data/raw
nifi.source.file_filter_024=yellow_tripdata_2026-09_024\.parquet
nifi.source.expected_filename_024=yellow_tripdata_2026-09_024.parquet
nifi.source.expected_size_bytes_024=67374896
nifi.source.expected_sha256_024=32d8d883e3fb9c0d681f4d47b205afe0fcb2a4830739673b4dd3bafbac9b0086

# Direktori tujuan HDFS
# - Tahap pengujian aman menggunakan direktori terisolasi:
nifi.hdfs.test_directory_024=/urbanpulse_024/nifi_test_024
# - Direktori Raw produksi (sudah berisi file identik terverifikasi; jangan ditimpa):
nifi.hdfs.production_raw_directory_024=/urbanpulse_024/raw/yellow_taxi

# Pengaturan proteksi data PutHDFS
nifi.puthdfs.conflict_resolution_strategy_024=ignore
nifi.puthdfs.compression_codec_024=NONE
