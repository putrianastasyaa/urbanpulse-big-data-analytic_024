# ==============================================================================
# UrbanPulse (_024) — Standalone Apache NiFi 1.28.1 Runtime Configuration Summary
# ==============================================================================
# Instalasi standalone terisolasi di WSL2 user space (/home/ubuntu/nifi-1.28.1).
# Tidak memodifikasi Java sistem, konfigurasi Hadoop/Spark, maupun data eksisting.
# ==============================================================================

nifi.version_024=1.28.1
nifi.install_dir_024=/home/ubuntu/nifi-1.28.1
nifi.java_home_024=/usr/lib/jvm/java-17-openjdk-amd64
nifi.java_version_024=OpenJDK 17.0.20

# Antarmuka Web UI lokal (localhost-only, menghindari konflik port Hadoop/Spark/Streamlit)
nifi.web.http.host=127.0.0.1
nifi.web.http.port=8090
nifi.web.ui_url_024=http://127.0.0.1:8090/nifi

# Konfigurasi alokasi memori JVM konservatif (conf/bootstrap.conf)
nifi.jvm.xms_024=-Xms512m
nifi.jvm.xmx_024=-Xmx1g

# Pembatasan penyimpanan repositori internal NiFi agar tetap ringan
nifi.provenance.repository.max.storage.size=256 MB
nifi.content.repository.archive.max.usage.percentage=30%
